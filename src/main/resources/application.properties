spring.application.name=alb
server.port=80

#logging.level.com.coding.alb.LoggingFilter=DEBUG
logging.file=CONSOLE

backend.server.hosts=localhost,localhost,localhost
backend.server.ports=8080,8081,8082
backend.server.selection.strategy=roundRobinStrategy

#10 seconds
healthcheck.period=30000

# Rate limiting configuration
rate.limit.max=100
rate.limit.window=60000

# Authentication configuration
auth.api.key=your-secret-api-key
auth.excluded.paths=/favicon.ico,/health
